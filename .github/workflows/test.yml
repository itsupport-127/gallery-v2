name: Tes gallery

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test/run.js
      - run: node test/tenant.js
      - run: node test/transaksi.js
      - name: Cek celah keamanan dependency (hanya peringatan, tidak menggagalkan tes)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
